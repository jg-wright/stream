name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish

jobs:
  publish-test:
    uses: ./.github/workflows/test.yml

  release-please:
    runs-on: ubuntu-latest
    needs: publish-test
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: bun run build

      - name: Publish to npm
        run: |
          echo '${{ needs.release-please.outputs.paths_released }}' | jq -r '.[]' | while read path; do
            if [ -f "$path/package.json" ]; then
              (cd "$path" && bun publish --access public --provenance --no-git-checks)
            fi
          done
