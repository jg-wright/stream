name: Build
description: Install dependencies, and build packages

runs:
  using: composite
  steps:
    - shell: bash
      run: bun install --frozen-lockfile

    - id: build-1
      shell: bash
      continue-on-error: true
      run: bun run build

    - shell: bash
      if: steps.build-1.outcome == 'failure'
      run: bun run build
